name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Lets the deploy job publish to Pages without a personal token.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push should win rather than queue behind an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` runs `tsc --noEmit` first, so a type error fails the deploy
      # rather than shipping.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
